name: Build ImmortalWrt N60 Pro MT7986
on:
  workflow_dispatch:
  push:
    branches: [ "25.12" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increase swap space to 4G
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3 python3-pip python3-setuptools python3-dev rsync unzip \
          wget zlib1g-dev file curl ca-certificates

      - name: Update & Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load .config
        run: |
          cp .config .config.bak
          make defconfig

      - name: Compile firmware
        run: |
          make -j$(nproc) V=s

      - name: Generate SHA256 checksum
        run: |
          cd bin/targets/*/*/
          sha256sum *.bin > sha256sums.txt

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N60Pro-Firmware-${{ github.sha }}
          path: bin/targets/*/*/*.bin
          retention-days: 7
