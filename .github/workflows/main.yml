name: Build N60 Pro - ImmortalWrt 25.12 (single standard profile)

on:
  workflow_dispatch:
  push:
    branches:
      - n60pro-mtk-closed-driver

permissions:
  contents: read

concurrency:
  group: n60-pro-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check N60 Pro device definitions
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Source revision ====="
          git log -1 --format='%H %s'
          echo "===== Standard profile definition ====="
          grep -Rni --include='*.mk' --include='*.dts' --include='*.dtsi' 'netcore.n60.pro' target/linux/mediatek || true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-dev rsync unzip zlib1g-dev file wget time xsltproc libelf-dev device-tree-compiler qemu-utils python3-setuptools python3-pyelftools swig ccache

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-openwrt-n60pro-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-openwrt-n60pro-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-openwrt-n60pro-ccache-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure standard OpenWrt-compatible profile first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/ccache" artifacts/N60-Pro/standard
          ccache --max-size=5G
          ccache --set-config=compiler_check=content

          cat > .config <<'EOF'
          # Snapshot the exact user-requested inputs before Kconfig normalization.
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y
          CONFIG_PACKAGE_luci=y
          # MTK proprietary Wi-Fi / acceleration / QoS stack and matching LuCI
          CONFIG_PACKAGE_datconf-lua=y
          CONFIG_PACKAGE_luci-app-eqos-mtk=y
          CONFIG_PACKAGE_luci-i18n-eqos-mtk-zh-cn=y
          CONFIG_PACKAGE_luci-app-turboacc-mtk=y
          CONFIG_PACKAGE_luci-i18n-turboacc-mtk-zh-cn=y
          CONFIG_PACKAGE_mii_mgr=y
          CONFIG_PACKAGE_mtkhqos_util=y
          CONFIG_PACKAGE_regs=y
          CONFIG_PACKAGE_switch=y
          # SMB3 file sharing via ksmbd; LuCI pulls required runtime dependencies
          CONFIG_PACKAGE_kmod-fs-ksmbd=y
          CONFIG_PACKAGE_ksmbd-server=y
          CONFIG_PACKAGE_luci-app-ksmbd=y
          # MTK proprietary Wi-Fi stack and matching LuCI frontend (MT7986)
          CONFIG_PACKAGE_kmod-conninfra=y
          CONFIG_PACKAGE_kmod-mediatek_hnat=y
          CONFIG_PACKAGE_kmod-mt_wifi=y
          CONFIG_PACKAGE_kmod-warp=y
          CONFIG_PACKAGE_datconf=y
          CONFIG_PACKAGE_wifi-dats=y
          CONFIG_PACKAGE_mtwifi-cfg-ucode=y
          CONFIG_MTK_CHIP_MT7986=y
          CONFIG_MTK_CONNINFRA_APSOC=y
          CONFIG_MTK_CONNINFRA_APSOC_MT7986=y
          CONFIG_MTK_FAST_NAT_SUPPORT=y
          CONFIG_MTK_FIRST_IF_EEPROM_FLASH=y
          CONFIG_MTK_FIRST_IF_IPAILNA=y
          CONFIG_MTK_FIRST_IF_MT7986=y
          CONFIG_MTK_MT_MAC=y
          CONFIG_MTK_MT_WIFI=m
          CONFIG_MTK_SUPPORT_OPENWRT=y
          CONFIG_MTK_WIFI_DRIVER=y
          CONFIG_MTK_MT_WIFI_DRIVER_VERSION_7673=y
          # Match the repository's MT7986 template: AP mode; retain 802.11k for WARP dependencies.
          CONFIG_MTK_WIFI_MODE_AP=m
          CONFIG_MTK_DOT11K_RRM_SUPPORT=y
          CONFIG_MTK_MT_WIFI_FIRMWARE_PATH_MT7986="mt7986-fw-20260601"
          CONFIG_MTK_MT_WIFI_MT7986_20260601=y
          CONFIG_MTK_MT_WIFI_PATH="mt_wifi"
          CONFIG_WARP_VERSION=2
          CONFIG_WARP_CHIPSET="mt7986"
          CONFIG_MTK_WLAN_HOOK=y
          CONFIG_MTK_WHNAT_SUPPORT=m
          CONFIG_MTK_WARP_V2=y
          CONFIG_CCACHE=y
          EOF

          cp .config artifacts/N60-Pro/standard/config.before-defconfig
          make defconfig
          echo "===== MTK Kconfig dependency diagnostics after defconfig ====="
          for symbol in CONFIG_MTK_MT_WIFI CONFIG_MTK_MT_MAC CONFIG_MTK_SUPPORT_OPENWRT CONFIG_MTK_WIFI_DRIVER CONFIG_MTK_WIFI_MODE_AP CONFIG_MTK_CHIP_MT7986 CONFIG_MTK_WLAN_HOOK CONFIG_WARP_CHIPSET CONFIG_MTK_FAST_NAT_SUPPORT CONFIG_MTK_WHNAT_SUPPORT CONFIG_MTK_WARP_V2 CONFIG_PACKAGE_kmod-conninfra CONFIG_PACKAGE_kmod-mediatek_hnat CONFIG_PACKAGE_kmod-hw_nat CONFIG_PACKAGE_kmod-warp; do
            grep -E "^${symbol}=" .config || echo "${symbol}=<unset>"
          done
          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y' .config || {
            echo "::error::Standard N60 Pro profile missing after defconfig."
            exit 1
          }
          grep -qx 'CONFIG_PACKAGE_luci=y' .config || {
            echo "::error::LuCI was not enabled."
            exit 1
          }
          for required in \
            'CONFIG_PACKAGE_kmod-conninfra=y' \
            'CONFIG_PACKAGE_kmod-mediatek_hnat=y' \
            'CONFIG_PACKAGE_kmod-mt_wifi=y' \
            'CONFIG_PACKAGE_kmod-warp=y' \
            'CONFIG_PACKAGE_datconf=y' \
            'CONFIG_PACKAGE_wifi-dats=y' \
            'CONFIG_PACKAGE_mtwifi-cfg-ucode=y' \
            'CONFIG_PACKAGE_datconf-lua=y' \
            'CONFIG_PACKAGE_luci-app-eqos-mtk=y' \
            'CONFIG_PACKAGE_luci-i18n-eqos-mtk-zh-cn=y' \
            'CONFIG_PACKAGE_luci-app-turboacc-mtk=y' \
            'CONFIG_PACKAGE_luci-i18n-turboacc-mtk-zh-cn=y' \
            'CONFIG_PACKAGE_mii_mgr=y' \
            'CONFIG_PACKAGE_mtkhqos_util=y' \
            'CONFIG_PACKAGE_regs=y' \
            'CONFIG_PACKAGE_switch=y' \
            'CONFIG_PACKAGE_kmod-fs-ksmbd=y' \
            'CONFIG_PACKAGE_ksmbd-server=y' \
            'CONFIG_PACKAGE_luci-app-ksmbd=y' \
            'CONFIG_MTK_CHIP_MT7986=y' \
            'CONFIG_MTK_CONNINFRA_APSOC=y' \
            'CONFIG_MTK_CONNINFRA_APSOC_MT7986=y' \
            'CONFIG_MTK_FAST_NAT_SUPPORT=y' \
            'CONFIG_MTK_FIRST_IF_EEPROM_FLASH=y' \
            'CONFIG_MTK_FIRST_IF_IPAILNA=y' \
            'CONFIG_MTK_FIRST_IF_MT7986=y' \
            'CONFIG_MTK_MT_MAC=y' \
            'CONFIG_MTK_MT_WIFI=m' \
            'CONFIG_MTK_SUPPORT_OPENWRT=y' \
            'CONFIG_MTK_WIFI_DRIVER=y' \
            'CONFIG_MTK_WIFI_MODE_AP=m' \
            'CONFIG_MTK_MT_WIFI_DRIVER_VERSION_7673=y' \
            'CONFIG_MTK_DOT11K_RRM_SUPPORT=y' \
            'CONFIG_MTK_MT_WIFI_FIRMWARE_PATH_MT7986="mt7986-fw-20260601"' \
            'CONFIG_MTK_MT_WIFI_MT7986_20260601=y' \
            'CONFIG_MTK_MT_WIFI_PATH="mt_wifi"' \
            'CONFIG_WARP_VERSION=2' \
            'CONFIG_WARP_CHIPSET="mt7986"' \
            'CONFIG_MTK_WLAN_HOOK=y' \
            'CONFIG_MTK_WHNAT_SUPPORT=m' \
            'CONFIG_MTK_WARP_V2=y'; do
            grep -Fqx "$required" .config || {
              echo "::error::Required MTK proprietary stack option missing after defconfig: $required"
              exit 1
            }
          done
          # Preserve both sides of Kconfig normalization so dropped symbols are evidence, not guesses.
          cp .config artifacts/N60-Pro/standard/config.after-defconfig
          diff -u artifacts/N60-Pro/standard/config.before-defconfig artifacts/N60-Pro/standard/config.after-defconfig > artifacts/N60-Pro/standard/config-defconfig.diff || true
          grep -E '^[+-]CONFIG_(MTK_|WARP_|PACKAGE_(kmod-(conninfra|mediatek_hnat|mt_wifi|warp)|mtwifi-cfg|wifi-dats|luci-app-mtwifi-cfg))' artifacts/N60-Pro/standard/config-defconfig.diff > artifacts/N60-Pro/standard/config-defconfig-mtk.diff || true
          echo "===== MTK-related changes caused by make defconfig ====="
          cat artifacts/N60-Pro/standard/config-defconfig-mtk.diff || true

          # Compare only driver-related options with the official MT7986 baseline.
          # Do not copy that template's device/profile selection into the N60 Pro build.
          grep -E '^(CONFIG_(MTK_MT_WIFI|MTK_MT_MAC|MTK_SUPPORT_OPENWRT|MTK_WIFI_DRIVER|MTK_WIFI_MODE_|MTK_MT_AP_SUPPORT|MTK_MT_STA_SUPPORT|MTK_WHNAT_SUPPORT|MTK_WARP_V2|MTK_FAST_NAT_SUPPORT|MTK_WLAN_HOOK|MTK_CONNINFRA_APSOC|MTK_CHIP_MT7986|WARP_)|CONFIG_PACKAGE_(kmod-(conninfra|mediatek_hnat|mt_wifi|warp)|mtwifi-cfg(-ucode)?|wifi-dats))=' defconfig/mt7986-ax6000-256m.config > artifacts/N60-Pro/standard/template-driver-options.txt || true
          grep -E '^(CONFIG_(MTK_MT_WIFI|MTK_MT_MAC|MTK_SUPPORT_OPENWRT|MTK_WIFI_DRIVER|MTK_WIFI_MODE_|MTK_MT_AP_SUPPORT|MTK_MT_STA_SUPPORT|MTK_WHNAT_SUPPORT|MTK_WARP_V2|MTK_FAST_NAT_SUPPORT|MTK_WLAN_HOOK|MTK_CONNINFRA_APSOC|MTK_CHIP_MT7986|WARP_)|CONFIG_PACKAGE_(kmod-(conninfra|mediatek_hnat|mt_wifi|warp)|mtwifi-cfg(-ucode)?|wifi-dats))=' .config > artifacts/N60-Pro/standard/effective-driver-options.txt || true
          diff -u artifacts/N60-Pro/standard/template-driver-options.txt artifacts/N60-Pro/standard/effective-driver-options.txt > artifacts/N60-Pro/standard/template-vs-effective-driver-options.diff || true

          # The new ucode configurator explicitly conflicts with legacy mtwifi-cfg.
          # The legacy LuCI app depends on mtwifi-cfg, so do not select both stacks.
          if grep -qx 'CONFIG_PACKAGE_mtwifi-cfg=y' .config || grep -qx 'CONFIG_PACKAGE_luci-app-mtwifi-cfg=y' .config; then
            echo "::error::Legacy mtwifi-cfg/LuCI package conflicts with mtwifi-cfg-ucode; remove the legacy stack."
            exit 1
          fi
          cp .config artifacts/N60-Pro/standard/config.buildinfo
          echo "PASS: standard profile is selected alone."

      - name: Download sources
        run: make download -j2

      - name: Build standard profile first
        run: make -j2 V=s

      - name: Collect and verify standard firmware
        shell: bash
        run: |
          set -euo pipefail
          OUT="bin/targets/mediatek/filogic"
          DEST="artifacts/N60-Pro/standard"
          mapfile -t ITBS < <(find "$OUT" -maxdepth 1 -type f -iname '*n60*pro*.itb' -print)
          if [ "${#ITBS[@]}" -eq 0 ]; then
            echo "::error::Standard profile did not produce an N60 Pro ITB."
            find "$OUT" -maxdepth 1 -type f -printf '%f\n'
            exit 1
          fi
          cp "${ITBS[@]}" "$DEST/"

          # Inspect the final FIT and extract its embedded FDT.
          ITB="${ITBS[0]}"
          dumpimage -l "$ITB" | tee "$DEST/fit-image-list.txt"
          dumpimage -T flat_dt -p 1 -o "$DEST/embedded.dtb" "$ITB"
          dtc -I dtb -O dts -o "$DEST/embedded.dts" "$DEST/embedded.dtb"
          grep -Fq 'model = "Netcore N60 Pro";' "$DEST/embedded.dts" || {
            echo "::error::Embedded FDT model is not Netcore N60 Pro."
            exit 1
          }
          grep -Fq 'netcore,n60-pro' "$DEST/embedded.dts" || {
            echo "::error::Embedded FDT compatible does not identify netcore,n60-pro."
            exit 1
          }
          grep -Fq 'compatible = "spi-nand";' "$DEST/embedded.dts" || {
            echo "::error::Embedded FDT does not declare SPI-NAND."
            exit 1
          }
          {
            echo "Embedded FDT verification: PASS"
            grep -E 'model =|compatible =|label = "(bl2|u-boot-env|factory|fip|ubi)"|reg = <0x0 0x100000>|reg = <0x580000 0x7a80000>' "$DEST/embedded.dts" || true
          } > "$DEST/EMBEDDED-DTS-CHECK.txt"

          # A Kconfig value of m only builds a module; the corresponding kmod
          # package must also be selected so its .ko is installed into the image.
          # Verify the final image manifest rather than trusting .config alone.
          mapfile -t MANIFESTS < <(find "$OUT" -maxdepth 1 -type f -name '*.manifest' -print)
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "::error::No image package manifest found; cannot verify closed-driver modules in the firmware."
            find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi
          MANIFEST=""
          for candidate in "${MANIFESTS[@]}"; do
            if grep -qE '(^|[[:space:]])kmod-mt_wifi([[:space:]]|$)' "$candidate"; then
              MANIFEST="$candidate"
              break
            fi
          done
          if [ -z "$MANIFEST" ]; then
            echo "::error::Could not find an N60 Pro image manifest containing kmod-mt_wifi."
            printf '%s\n' "${MANIFESTS[@]}"
            exit 1
          fi
          echo "===== Closed-driver kernel modules listed in final image manifest ====="
          for package in kmod-conninfra kmod-mediatek_hnat kmod-mt_wifi kmod-warp; do
            if grep -qE "^${package//-/\\-}([[:space:]]|$)" "$MANIFEST"; then
              grep -E "^${package//-/\\-}([[:space:]]|$)" "$MANIFEST"
            else
              echo "::error::Required closed-driver package missing from image manifest: $package"
              exit 1
            fi
          done
          cp "$MANIFEST" "$DEST/image-packages.manifest"
          {
            echo "Closed-driver module package verification: PASS"
            echo "Manifest source: $MANIFEST"
            echo "Verified packages: kmod-conninfra, kmod-mediatek_hnat, kmod-mt_wifi, kmod-warp"
          } > "$DEST/CLOSED-DRIVER-MODULES.txt"
          {
            echo "Priority: PRIMARY candidate; OpenWrt-compatible standard profile"
            echo "Profile: netcore_n60-pro"
            echo "Expected DTS: mt7986a-netcore-n60-pro"
            echo "Expected format: sysupgrade.itb"
            echo "Source revision:"
            git log -1 --format='%H %s'
            echo "Files:"
            find "$DEST" -maxdepth 1 -type f -printf '%f\n' | sort
          } > "$DEST/BUILD-INFO.txt"
          echo "===== PRIMARY standard firmware ====="
          ls -lh "$DEST"

      - name: Create build summary and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          {
            echo
            echo "Final verification summary:"
            echo "Repository: laodadelaoda/immortalwrt-mt798x-rebase"
            echo "Profile: netcore_n60-pro"
            echo "Expected DTS: mt7986a-netcore-n60-pro"
            echo "Build output: standard sysupgrade.itb candidate"
            echo "Source revision:"
            git log -1 --format='%H %s'
            echo "Embedded FDT, final image manifest, and closed-driver package checks are recorded alongside this file."
          } >> artifacts/N60-Pro/standard/BUILD-INFO.txt
          (
            cd artifacts/N60-Pro/standard
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          echo "===== Final artifact tree ====="
          find artifacts/N60-Pro -maxdepth 2 -type f -printf '%p (%s bytes)\\n' | sort
          echo "===== ccache statistics ====="
          ccache -s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N60-Pro-ImmortalWrt-25.12-Single-Standard-${{ github.run_number }}
          path: artifacts/N60-Pro/
          if-no-files-found: error
          retention-days: 14

      - name: Report compiler cache statistics
        if: always()
        run: ccache -s
