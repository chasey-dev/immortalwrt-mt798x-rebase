
name: Build N60 Pro - ImmortalWrt 25.12

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n60-pro-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check N60 Pro device definition
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Source revision ==="
          git log -1 --format='%H %s'

          echo "=== Search device definitions ==="
          grep -Rni \
            --include='*.mk' \
            --include='*.dts' \
            --include='*.dtsi' \
            --include='Config.in' \
            'netcore.n60.pro' \
            target/linux/mediatek || true

          if ! grep -Rqi \
            --include='*.mk' \
            --include='*.dts' \
            --include='*.dtsi' \
            'netcore.n60-pro-mtkuboot' \
            target/linux/mediatek; then
            echo "::error::Expected N60 Pro mtkuboot definition not found."
            echo "Inspect the device profile and DTS before compiling."
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-dev \
            rsync unzip zlib1g-dev file wget \
            time xsltproc libelf-dev \
            device-tree-compiler qemu-utils \
            python3-setuptools python3-pyelftools \
            swig
          
      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
    
      - name: Diagnose N60 Pro profile
        shell: bash
        run: |
          set -u

          echo "===== 1. Source revision ====="
          git log -1 --format='%H %s'

          echo "===== 2. N60-related image definitions ====="
          grep -RniE \
            'netcore.?n60|n60.?pro|mtkuboot' \
            target/linux/mediatek/image \
            target/linux/mediatek/filogic 2>/dev/null || true

          echo "===== 3. Device tree files ====="
          find target/linux/mediatek \
            -type f \( -iname '*n60*' -o -iname '*netcore*' \) \
            -print

          echo "===== 4. Selected target configuration ====="
          make defconfig
          grep -Ei \
            'CONFIG_TARGET_(mediatek|DEVICE.*(n60|netcore))' \
            .config || true

          echo "===== Diagnostic only: build intentionally stopped ====="
          exit 1

      - name: Download sources
        run: make download -j2

      - name: Compile firmware
        run: make -j2 V=s

      - name: Collect firmware and checksums
        shell: bash
        run: |
          set -euo pipefail
          OUT="bin/targets/mediatek/filogic"

          test -d "$OUT"
          find "$OUT" -maxdepth 1 -type f \
            \( -name '*n60*' -o -name '*N60*' \) -print

          find "$OUT" -maxdepth 1 -type f \
            \( -name '*.itb' -o -name '*.bin' -o -name '*.tar' \) \
            -exec sha256sum {} \; > "$OUT/SHA256SUMS.txt"

          cp config.buildinfo "$OUT/"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N60-Pro-ImmortalWrt-25.12
          path: bin/targets/mediatek/filogic/
          if-no-files-found: error
          retention-days: 14
