name: Build N60 Pro - ImmortalWrt 25.12

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n60-pro-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check N60 Pro device definition
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Source revision ====="
          git log -1 --format='%H %s'

          echo "===== N60 Pro device definitions ====="
          grep -Rni \
            --include='*.mk' \
            --include='*.dts' \
            --include='*.dtsi' \
            'netcore.n60.pro' \
            target/linux/mediatek || true

          echo "===== Check MTK U-Boot profile ====="
          if ! grep -Rqi \
            --include='*.mk' \
            --include='*.dts' \
            'netcore_n60-pro-mtkuboot' \
            target/linux/mediatek; then
            echo "::error::N60 Pro MTK U-Boot definition not found."
            exit 1
          fi

          echo "Device definition exists."

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-dev \
            rsync unzip zlib1g-dev file wget \
            time xsltproc libelf-dev \
            device-tree-compiler qemu-utils \
            python3-setuptools python3-pyelftools \
            swig

      - name: Update and install feeds
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Diagnose and validate N60 Pro profile
        shell: bash
        run: |
          set -u

          echo "===== Write requested configuration ====="
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro-mtkuboot=y
          EOF

          echo "===== Run make defconfig ====="
          if ! make defconfig; then
            echo "::error::make defconfig failed."
            exit 1
          fi

          echo "===== Final target configuration ====="
          grep -E \
            '^CONFIG_TARGET_(mediatek|mediatek_filogic)=|^CONFIG_TARGET_mediatek_filogic_DEVICE_' \
            .config || true

          echo "===== Search generated Kconfig files ====="
          grep -RniE \
            'netcore_n60-pro-mtkuboot|DEVICE_netcore_n60-pro' \
            tmp/.config-target.in \
            tmp/.config-package.in \
            target/linux/mediatek 2>/dev/null | head -n 160 || true

          echo "===== Validate selected device ====="
          if grep -qx \
            'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro-mtkuboot=y' \
            .config; then
            echo "PASS: N60 Pro MTK U-Boot profile is selected."
          else
            echo "::error::N60 Pro profile was not selected."
            echo "Do not compile until the profile selection issue is resolved."
            exit 1
          fi

          echo "===== Diagnostic complete; firmware build intentionally skipped ====="
