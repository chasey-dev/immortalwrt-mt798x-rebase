name: Build N60 Pro - ImmortalWrt 25.12 (single standard profile)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n60-pro-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check N60 Pro device definitions
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Source revision ====="
          git log -1 --format='%H %s'
          echo "===== Standard profile definition ====="
          grep -Rni --include='*.mk' --include='*.dts' --include='*.dtsi' 'netcore.n60.pro' target/linux/mediatek || true
          echo "===== MTK U-Boot profile definition ====="
          grep -Rni --include='*.mk' --include='*.dts' 'netcore_n60-pro-mtkuboot' target/linux/mediatek

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-dev rsync unzip zlib1g-dev file wget time xsltproc libelf-dev device-tree-compiler qemu-utils python3-setuptools python3-pyelftools swig ccache

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-openwrt-n60pro-ccache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-openwrt-n60pro-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-openwrt-n60pro-ccache-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure standard OpenWrt-compatible profile first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/ccache" artifacts/N60-Pro/standard
          ccache --max-size=5G
          ccache --set-config=compiler_check=content

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y
          CONFIG_PACKAGE_luci=y
          # MTK proprietary Wi-Fi / acceleration / QoS stack and matching LuCI
          CONFIG_PACKAGE_datconf-lua=y
          CONFIG_PACKAGE_luci-app-eqos-mtk=y
          CONFIG_PACKAGE_luci-i18n-eqos-mtk-zh-cn=y
          CONFIG_PACKAGE_luci-app-turboacc-mtk=y
          CONFIG_PACKAGE_luci-i18n-turboacc-mtk-zh-cn=y
          CONFIG_PACKAGE_mii_mgr=y
          CONFIG_PACKAGE_mtkhqos_util=y
          CONFIG_PACKAGE_regs=y
          CONFIG_PACKAGE_switch=y
          # SMB3 file sharing via ksmbd; LuCI pulls required runtime dependencies
          CONFIG_PACKAGE_kmod-fs-ksmbd=y
          CONFIG_PACKAGE_ksmbd-server=y
          CONFIG_PACKAGE_ksmbd-tools=y
          CONFIG_PACKAGE_luci-app-ksmbd=y
          # MTK proprietary Wi-Fi stack and matching LuCI frontend (MT7986)
          CONFIG_PACKAGE_kmod-conninfra=y
          CONFIG_PACKAGE_kmod-mediatek_hnat=y
          CONFIG_PACKAGE_kmod-mt_wifi=y
          CONFIG_PACKAGE_kmod-warp=y
          CONFIG_PACKAGE_datconf=y
          CONFIG_PACKAGE_wifi-dats=y
          CONFIG_PACKAGE_mtwifi-cfg=y
          # mtwifi-cfg-ucode is not a selectable package in the current feeds; keep the parent config package.
          CONFIG_PACKAGE_luci-app-mtwifi-cfg=y
          CONFIG_PACKAGE_luci-i18n-mtwifi-cfg-zh-cn=y
          CONFIG_MTK_CHIP_MT7986=y
          CONFIG_MTK_CONNINFRA_APSOC=y
          CONFIG_MTK_CONNINFRA_APSOC_MT7986=y
          CONFIG_MTK_FAST_NAT_SUPPORT=y
          CONFIG_MTK_FIRST_IF_EEPROM_FLASH=y
          CONFIG_MTK_FIRST_IF_IPAILNA=y
          CONFIG_MTK_FIRST_IF_MT7986=y
          CONFIG_MTK_MT_WIFI=m
          CONFIG_MTK_MT_WIFI_DRIVER_VERSION_7673=y
          CONFIG_MTK_MT_WIFI_FIRMWARE_PATH_MT7986="mt7986-fw-20260601"
          CONFIG_MTK_MT_WIFI_MT7986_20260601=y
          CONFIG_MTK_MT_WIFI_PATH="mt_wifi"
          CONFIG_MTK_WARP_V2=y
          CONFIG_MTK_WHNAT_SUPPORT=m
          CONFIG_CCACHE=y
          EOF

          make defconfig
          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y' .config || {
            echo "::error::Standard N60 Pro profile missing after defconfig."
            exit 1
          }
          if grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro-mtkuboot=y' .config; then
            echo "::error::Unexpected MTK U-Boot profile selected during standard build."
            exit 1
          fi
          grep -qx 'CONFIG_PACKAGE_luci=y' .config || {
            echo "::error::LuCI was not enabled."
            exit 1
          }
          for required in \
            'CONFIG_PACKAGE_kmod-conninfra=y' \
            'CONFIG_PACKAGE_kmod-mediatek_hnat=y' \
            'CONFIG_PACKAGE_kmod-mt_wifi=y' \
            'CONFIG_PACKAGE_kmod-warp=y' \
            'CONFIG_PACKAGE_datconf=y' \
            'CONFIG_PACKAGE_wifi-dats=y' \
            'CONFIG_PACKAGE_mtwifi-cfg=y' \
            'CONFIG_PACKAGE_luci-app-mtwifi-cfg=y' \
            'CONFIG_PACKAGE_luci-i18n-mtwifi-cfg-zh-cn=y' \
            'CONFIG_PACKAGE_datconf-lua=y' \
            'CONFIG_PACKAGE_luci-app-eqos-mtk=y' \
            'CONFIG_PACKAGE_luci-i18n-eqos-mtk-zh-cn=y' \
            'CONFIG_PACKAGE_luci-app-turboacc-mtk=y' \
            'CONFIG_PACKAGE_luci-i18n-turboacc-mtk-zh-cn=y' \
            'CONFIG_PACKAGE_mii_mgr=y' \
            'CONFIG_PACKAGE_mtkhqos_util=y' \
            'CONFIG_PACKAGE_regs=y' \
            'CONFIG_PACKAGE_switch=y' \
            'CONFIG_PACKAGE_kmod-fs-ksmbd=y' \
            'CONFIG_PACKAGE_ksmbd-server=y' \
            'CONFIG_PACKAGE_ksmbd-tools=y' \
            'CONFIG_PACKAGE_luci-app-ksmbd=y' \
            'CONFIG_MTK_CHIP_MT7986=y' \
            'CONFIG_MTK_CONNINFRA_APSOC=y' \
            'CONFIG_MTK_CONNINFRA_APSOC_MT7986=y' \
            'CONFIG_MTK_FAST_NAT_SUPPORT=y' \
            'CONFIG_MTK_FIRST_IF_EEPROM_FLASH=y' \
            'CONFIG_MTK_FIRST_IF_IPAILNA=y' \
            'CONFIG_MTK_FIRST_IF_MT7986=y' \
            'CONFIG_MTK_MT_WIFI=m' \
            'CONFIG_MTK_MT_WIFI_DRIVER_VERSION_7673=y' \
            'CONFIG_MTK_MT_WIFI_FIRMWARE_PATH_MT7986="mt7986-fw-20260601"' \
            'CONFIG_MTK_MT_WIFI_MT7986_20260601=y' \
            'CONFIG_MTK_MT_WIFI_PATH="mt_wifi"' \
            'CONFIG_MTK_WARP_V2=y' \
            'CONFIG_MTK_WHNAT_SUPPORT=m'; do
            grep -Fqx "$required" .config || {
              echo "::error::Required MTK proprietary stack option missing after defconfig: $required"
              exit 1
            }
          done
          cp .config artifacts/N60-Pro/standard/config.buildinfo
          echo "PASS: standard profile is selected alone."

      - name: Download sources
        run: make download -j2

      - name: Build standard profile first
        run: make -j2 V=s

      - name: Collect and verify standard firmware
        shell: bash
        run: |
          set -euo pipefail
          OUT="bin/targets/mediatek/filogic"
          DEST="artifacts/N60-Pro/standard"
          mapfile -t ITBS < <(find "$OUT" -maxdepth 1 -type f -iname '*n60*pro*.itb' -print)
          if [ "${#ITBS[@]}" -eq 0 ]; then
            echo "::error::Standard profile did not produce an N60 Pro ITB."
            find "$OUT" -maxdepth 1 -type f -printf '%f\n'
            exit 1
          fi
          cp "${ITBS[@]}" "$DEST/"
          {
            echo "Priority: PRIMARY candidate; OpenWrt-compatible standard profile"
            echo "Profile: netcore_n60-pro"
            echo "Expected DTS: mt7986a-netcore-n60-pro"
            echo "Expected format: sysupgrade.itb"
            echo "Source revision:"
            git log -1 --format='%H %s'
            echo "Files:"
            find "$DEST" -maxdepth 1 -type f -printf '%f\n' | sort
          } > "$DEST/BUILD-INFO.txt"
          (
            cd "$DEST"
            sha256sum *.itb config.buildinfo BUILD-INFO.txt > SHA256SUMS.txt
          )
          echo "===== PRIMARY standard firmware ====="
          ls -lh "$DEST"
          cat "$DEST/SHA256SUMS.txt"

      - name: Create build summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Repository: laodadelaoda/immortalwrt-mt798x-rebase"
            echo "Profile: netcore_n60-pro"
            echo "Expected DTS: mt7986a-netcore-n60-pro"
            echo "Build output: one standard sysupgrade.itb candidate only"
            echo "Source revision:"
            git log -1 --format='%H %s'
            echo "The MTK U-Boot profile is intentionally not built."
            echo "Review the DTS, partition layout and SHA256 before flashing."
          } > artifacts/N60-Pro/BUILD-INFO.txt
          echo "===== Final artifact tree ====="
          find artifacts/N60-Pro -maxdepth 2 -type f -printf '%p (%s bytes)\\n' | sort
          echo "===== ccache statistics ====="
          ccache -s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N60-Pro-ImmortalWrt-25.12-Single-Standard
          path: artifacts/N60-Pro/
          if-no-files-found: error
          retention-days: 14

      - name: Report compiler cache statistics
        if: always()
        run: ccache -s
