name: Build N60 Pro - ImmortalWrt Closed Driver

on:
  workflow_dispatch:
  push:
    branches:
      - n60pro-mtk-closed-driver
    paths:
      - '.github/workflows/main.yml'
      - 'defconfig/**'
      - 'target/linux/mediatek/**'

permissions:
  contents: write

concurrency:
  group: n60-pro-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify DTS integrity
        run: |
          echo "===== DTS integrity check ====="
          echo "This workflow does NOT modify any DTS files."
          echo "It only records their hashes for reference."
          echo
          for dts in \
            target/linux/mediatek/dts/mt7986a-netcore-n60-pro.dts \
            target/linux/mediatek/dts/mt7986a-netcore-n60-pro.dtsi; do
            if [ -f "$dts" ]; then
              sha256sum "$dts"
            fi
          done
          echo
          echo "===== All N60 Pro related DTS files ====="
          find target/linux/mediatek -type f \( -name "*n60*pro*" -o -name "*netcore*" \) -print 2>/dev/null || true
          echo
          echo "===== DTS source revision ====="
          git log -1 --format='%H %s' -- target/linux/mediatek/dts/ 2>/dev/null || true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev rsync unzip zlib1g-dev file wget time xsltproc \
            libelf-dev device-tree-compiler qemu-utils python3-setuptools \
            python3-pyelftools swig ccache

      - name: Set Go proxy
        run: |
          echo "GOPROXY=https://goproxy.cn,direct" >> $GITHUB_ENV
          echo "GOSUMDB=off" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-n60pro-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-n60pro-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-n60pro-ccache-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure N60 Pro closed-driver firmware
        run: |
          mkdir -p "$HOME/.cache/ccache"
          ccache --max-size=5G
          ccache --set-config=compiler_check=content

          cat > .config <<'EOF'
          # Target
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y

          # LuCI
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          # MTK closed-source Wi-Fi stack
          CONFIG_PACKAGE_kmod-mt_wifi=y
          CONFIG_PACKAGE_kmod-conninfra=y
          CONFIG_PACKAGE_kmod-mediatek_hnat=y
          CONFIG_PACKAGE_kmod-warp=y
          CONFIG_PACKAGE_wifi-dats=y
          CONFIG_PACKAGE_mtwifi-cfg-ucode=y
          CONFIG_PACKAGE_datconf=y
          CONFIG_PACKAGE_datconf-lua=y

          # MTK Kconfig for MT7986
          CONFIG_MTK_CHIP_MT7986=y
          CONFIG_MTK_CONNINFRA_APSOC=y
          CONFIG_MTK_CONNINFRA_APSOC_MT7986=y
          CONFIG_MTK_FAST_NAT_SUPPORT=y
          CONFIG_MTK_FIRST_IF_EEPROM_FLASH=y
          CONFIG_MTK_FIRST_IF_IPAILNA=y
          CONFIG_MTK_FIRST_IF_MT7986=y
          CONFIG_MTK_MT_MAC=y
          CONFIG_MTK_MT_WIFI=m
          CONFIG_MTK_SUPPORT_OPENWRT=y
          CONFIG_MTK_WIFI_DRIVER=y
          CONFIG_MTK_WIFI_MODE_AP=m
          CONFIG_MTK_WIFI_SKU_TYPE="AX6000"
          CONFIG_first_card_name="MT7986"
          CONFIG_MTK_DOT11K_RRM_SUPPORT=y
          CONFIG_MTK_MT_WIFI_PATH="mt_wifi"
          CONFIG_MTK_WLAN_HOOK=y
          CONFIG_MTK_WHNAT_SUPPORT=m
          CONFIG_MTK_WARP_V2=y
          CONFIG_WARP_VERSION=2
          CONFIG_WARP_CHIPSET="mt7986"

          # Optional MTK extras
          CONFIG_PACKAGE_luci-app-turboacc-mtk=y
          CONFIG_PACKAGE_luci-i18n-turboacc-mtk-zh-cn=y
          CONFIG_PACKAGE_luci-app-eqos-mtk=y
          CONFIG_PACKAGE_luci-i18n-eqos-mtk-zh-cn=y
          CONFIG_PACKAGE_mii_mgr=y
          CONFIG_PACKAGE_mtkhqos_util=y
          CONFIG_PACKAGE_regs=y
          CONFIG_PACKAGE_switch=y

          # File sharing
          CONFIG_PACKAGE_kmod-fs-ksmbd=y
          CONFIG_PACKAGE_ksmbd-server=y
          CONFIG_PACKAGE_luci-app-ksmbd=y

          # Build optimization
          CONFIG_CCACHE=y
          EOF

          cp .config .config.before-defconfig
          make defconfig

          # 关键配置校验（失败即停，因为这几项是闭源驱动的基础）
          for required in \
            'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y' \
            'CONFIG_PACKAGE_kmod-mt_wifi=y' \
            'CONFIG_PACKAGE_kmod-conninfra=y' \
            'CONFIG_PACKAGE_kmod-mediatek_hnat=y' \
            'CONFIG_PACKAGE_kmod-warp=y' \
            'CONFIG_PACKAGE_wifi-dats=y' \
            'CONFIG_PACKAGE_mtwifi-cfg-ucode=y' \
            'CONFIG_MTK_MT_WIFI=m' \
            'CONFIG_MTK_WIFI_DRIVER=y' \
            'CONFIG_MTK_WIFI_MODE_AP=m' \
            'CONFIG_MTK_WIFI_SKU_TYPE="AX6000"' \
            'CONFIG_first_card_name="MT7986"'; do
            grep -Fqx "$required" .config || {
              echo "::error::Required option missing after defconfig: $required"
              echo "===== Effective MTK options ====="
              grep -E '^(CONFIG_(MTK_|WARP_)|CONFIG_first_card_name|CONFIG_PACKAGE_(kmod-(mt_wifi|conninfra|mediatek_hnat|warp)|wifi-dats|mtwifi-cfg-ucode))=' .config || true
              exit 1
            }
          done

          # 防止旧版 mtwifi-cfg 与新版 ucode 冲突
          if grep -qx 'CONFIG_PACKAGE_mtwifi-cfg=y' .config || \
             grep -qx 'CONFIG_PACKAGE_luci-app-mtwifi-cfg=y' .config; then
            echo "::error::Legacy mtwifi-cfg selected; conflicts with mtwifi-cfg-ucode."
            exit 1
          fi

          echo "===== Effective closed-driver options ====="
          grep -E '^(CONFIG_(MTK_|WARP_)|CONFIG_first_card_name|CONFIG_PACKAGE_(kmod-(mt_wifi|conninfra|mediatek_hnat|warp)|wifi-dats|mtwifi-cfg-ucode))=' .config

          echo "===== Config diff (before vs after defconfig) ====="
          diff <(sort .config.before-defconfig) <(sort .config) || true

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build firmware
        run: make -j$(nproc) V=s
        continue-on-error: true

      - name: Collect firmware and verify closed drivers
        if: always()
        run: |
          OUT="bin/targets/mediatek/filogic"
          DEST="artifacts/N60-Pro"
          mkdir -p "$DEST"

          echo "===== Build outputs ====="
          ls -lh "$OUT" 2>/dev/null || echo "No output directory"

          # 复制固件产物
          find "$OUT" -maxdepth 1 -type f \( \
            -name "*.itb" -o -name "*.bin" -o -name "*.manifest" \
            -o -name "*.buildinfo" -o -name "sha256sums" \
            \) -exec cp -v {} "$DEST/" \; 2>/dev/null || true

          # 保存完整配置
          cp .config "$DEST/config.full" 2>/dev/null || true
          cp .config.before-defconfig "$DEST/config.before-defconfig" 2>/dev/null || true

          # 记录 DTS 哈希（与构建前一致，用于确认未被修改）
          {
            echo "===== DTS hashes at build time ====="
            for dts in \
              target/linux/mediatek/dts/mt7986a-netcore-n60-pro.dts \
              target/linux/mediatek/dts/mt7986a-netcore-n60-pro.dtsi; do
              [ -f "$dts" ] && sha256sum "$dts"
            done
          } > "$DEST/DTS-HASHES.txt" 2>&1

          # 检查 kmod 包是否真的包含 .ko（这是关键验证）
          {
            echo "===== Closed-driver kernel module verification ====="
            for pkgname in kmod-mt_wifi kmod-conninfra kmod-mediatek_hnat kmod-warp; do
              echo
              echo "--- $pkgname ---"
              PKG=$(find bin/ -name "${pkgname}_*.apk" -o -name "${pkgname}_*.ipk" 2>/dev/null | head -1)
              if [ -z "$PKG" ]; then
                echo "PACKAGE NOT FOUND in bin/"
                continue
              fi
              echo "Package: $PKG"
              TMP=$(mktemp -d)
              case "$PKG" in
                *.apk)
                  tar -xzf "$PKG" -C "$TMP" 2>/dev/null || true
                  ;;
                *.ipk)
                  ( cd "$TMP" && ar x "$OLDPWD/$PKG" 2>/dev/null && \
                    tar -xzf data.tar.gz 2>/dev/null ) || true
                  ;;
              esac
              find "$TMP" -name "*.ko" -exec basename {} \; | sort
              for ko in $(find "$TMP" -name "*.ko"); do
                echo "  vermagic: $(strings "$ko" | grep -m1 vermagic || echo unknown)"
              done
              rm -rf "$TMP"
            done
          } > "$DEST/CLOSED-DRIVER-KO-CHECK.txt" 2>&1

          # 保存最终 manifest 里的闭源驱动包
          MANIFEST=$(find "$OUT" -maxdepth 1 -name "*.manifest" | head -1)
          if [ -n "$MANIFEST" ]; then
            grep -E '^(kmod-mt_wifi|kmod-conninfra|kmod-mediatek_hnat|kmod-warp|wifi-dats|mtwifi-cfg-ucode)' \
              "$MANIFEST" > "$DEST/MANIFEST-CLOSED-DRIVER.txt" 2>&1 || true
          fi

          # 记录最终 rootfs 中的 DAT 文件（如果还能找到）
          {
            echo "===== Rootfs DAT files ====="
            find build_dir/target-* staging_dir/target-* -type f \
              -path '*/etc/wireless/*' -printf '%p\n' 2>/dev/null | head -50 || true
          } > "$DEST/DAT-FILES.txt" 2>&1

          # 生成校验和
          ( cd "$DEST" && find . -maxdepth 1 -type f ! -name 'SHA256SUMS' \
            -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS ) || true

          echo "===== Final artifact list ====="
          ls -lh "$DEST"

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: N60-Pro-Firmware-${{ github.run_number }}
          path: artifacts/N60-Pro/
          if-no-files-found: warn
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: n60pro-build-${{ github.run_number }}
          name: "N60 Pro Closed Driver Build #${{ github.run_number }}"
          files: |
            artifacts/N60-Pro/*.itb
            artifacts/N60-Pro/*.manifest
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
